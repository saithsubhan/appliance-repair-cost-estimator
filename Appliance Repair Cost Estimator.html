            html += `<label class="adi-option-card ${selected}">
              <input type="radio" name="step2" value="${brand}" ${selected ? 'checked' : ''}>
              <span>${brand}</span>
            </label>`;
          });
          html += '</div>';
          return html;
        }

        function renderStep3() {
          if (!selections.appliance) { currentStep = 1; render(); return ''; }
          const issues = issuesByAppliance[selections.appliance] || [];
          let html = '<div class="adi-options-grid">';
          issues.forEach(issue => {
            const selected = selections.issue === issue.name ? 'selected' : '';
            html += `<label class="adi-option-card ${selected}">
              <input type="radio" name="step3" value="${issue.name}" data-severity="${issue.severity}" ${selected ? 'checked' : ''}>
              <span>${issue.name}</span>
            </label>`;
          });
          html += '</div>';
          return html;
        }

        function renderStep4() {
          let html = '<div class="adi-input-section">';
          html += `
            <select id="age-select" class="adi-select">
              <option value="">Select age range</option>
              <option value="0-5" ${selections.age === '0-5' ? 'selected' : ''}>0 - 5 years</option>
              <option value="6-10" ${selections.age === '6-10' ? 'selected' : ''}>6 - 10 years</option>
              <option value="11-15" ${selections.age === '11-15' ? 'selected' : ''}>11 - 15 years</option>
              <option value="16+" ${selections.age === '16+' ? 'selected' : ''}>16+ years</option>
            </select>
            <p style="margin:15px 0 8px; font-weight:600;">Zip Code (Jupiter area)</p>
            <input type="text" id="zip-input" class="adi-input" maxlength="5" placeholder="33458" value="${selections.zip || ''}">
          `;
          html += '</div>';
          return html;
        }

        function render() {
          const stepHtml = `
            <div class="adi-step-header">
              <span class="adi-step-question">${getStepQuestion()}</span>
              <span class="adi-step-counter">Step ${currentStep} of ${totalSteps}</span>
            </div>
            ${currentStep === 1 ? renderStep1() : ''}
            ${currentStep === 2 ? renderStep2() : ''}
            ${currentStep === 3 ? renderStep3() : ''}
            ${currentStep === 4 ? renderStep4() : ''}
            <div class="adi-nav-row">
              <button class="adi-btn-back" id="adiBackBtn" ${currentStep === 1 ? 'disabled' : ''}>← Back</button>
              ${currentStep === 4 ? `<button class="adi-btn-estimate" id="adiEstimateBtn">Estimate Cost →</button>` : '<div></div>' }
            </div>
          `;
          container.innerHTML = stepHtml;
          attachListeners();
          updateProgress();
        }

        function updateProgress() {
          progressFill.style.width = (currentStep * 25) + '%';
        }

        // ==================== EVENT LISTENERS ====================
        function attachListeners() {
          document.querySelectorAll('.adi-option-card input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
              document.querySelectorAll(`.adi-option-card input[name="${this.name}"]`).forEach(r => {
                const card = r.closest('.adi-option-card');
                card.classList.toggle('selected', r.checked);
              });

              if (this.name === 'step1') {
                selections.appliance = this.value;
                selections.brand = selections.issue = selections.severity = selections.age = selections.zip = null;
                setTimeout(() => { currentStep = 2; render(); }, 280);
              } else if (this.name === 'step2') {
                selections.brand = this.value;
                selections.issue = selections.severity = selections.age = selections.zip = null;
                setTimeout(() => { currentStep = 3; render(); }, 280);
              } else if (this.name === 'step3') {
                selections.issue = this.value;
                selections.severity = this.dataset.severity;
                selections.age = selections.zip = null;
                setTimeout(() => { currentStep = 4; render(); }, 280);
              }
            });
          });

          const backBtn = document.getElementById('adiBackBtn');
          if (backBtn) backBtn.addEventListener('click', () => { if (currentStep > 1) { currentStep--; render(); } });

          const estBtn = document.getElementById('adiEstimateBtn');
          if (estBtn) {
            estBtn.addEventListener('click', () => {
              const ageSelect = document.getElementById('age-select');
              const zipInput = document.getElementById('zip-input');

              if (!ageSelect.value) return showToast("Please select the age of your appliance");
              if (!zipInput.value || !/^\d{5}$/.test(zipInput.value)) return showToast("Please enter a valid 5-digit zip code");

              selections.age = ageSelect.value;
              selections.zip = zipInput.value.trim();
              generateEstimate();
            });
          }
        }

        // ==================== CALCULATION & RESULTS ====================
        function calculateEstimate() {
          let base = 150 + Math.random() * 120;
          const applianceBase = { 'Refrigerator': 220, 'Washing Machine': 170, 'Dryer': 160, 'Dishwasher': 180, 'Oven/Range': 200, 'Stove': 140, 'Cooktop': 150, 'Microwave': 100, 'Freezer': 190, 'Garbage Disposal': 110, 'Ice Maker': 130, 'Range Hood': 120, 'Wine Cooler': 210, 'Warming Drawer': 140, 'Vent Hood': 115, 'Trash Compactor': 160, 'Coffee System': 180, 'BBQ': 150, 'Pool Heater': 280 };
          base += applianceBase[selections.appliance] || 130;

          const premiumBrands = ['Sub-Zero','Viking','Thermador','Miele','Wolf','Dacor','Jenn-Air','Bosch'];
          if (premiumBrands.includes(selections.brand)) base *= 1.28;
          else if (selections.brand === 'Other') base *= 0.92;

          if (selections.severity === 'major') base += 160;
          else if (selections.severity === 'moderate') base += 85;
          else base += 45;

          if (selections.age === '16+') base *= 1.38;
          else if (selections.age === '11-15') base *= 1.26;
          else if (selections.age === '6-10') base *= 1.14;

          if (selections.zip.startsWith('334')) base *= 0.90;

          const variance = Math.random() * 0.22 - 0.11;
          base = Math.round(base * (1 + variance));

          return {
            partsLow: Math.round(base * 0.38),
            partsHigh: Math.round(base * 0.62),
            laborLow: Math.round(base * 0.32),
            laborHigh: Math.round(base * 0.52),
            totalLow: Math.round(base * 0.7),
            totalHigh: Math.round(base * 1.3)
          };
        }

        function generateEstimate() {
          const { appliance, brand, issue, age, zip, severity } = selections;
          container.innerHTML = `
            <div class="adi-loading">
              <div class="adi-spinner"></div>
              <div style="font-size:1.8rem; font-weight:700; color:#0B1E33;">Calculating Estimate</div>
              <div class="adi-countdown" id="adiCountdown">4</div>
              <p style="margin-top:1.5rem; font-size:1.1rem;">For your <strong>${brand} ${appliance}</strong><br>Issue: ${issue}<br>Age: ${ageDisplay[age]}<br>Zip: ${zip}</p>
            </div>
          `;

          let count = 4;
          const cd = document.getElementById('adiCountdown');
          const int = setInterval(() => { count--; if (cd) cd.textContent = count; if (count <= 0) clearInterval(int); }, 900);

          setTimeout(() => {
            clearInterval(int);
            const est = calculateEstimate();
            const sevClass = severity === 'major' ? 'adi-badge-high' : severity === 'moderate' ? 'adi-badge-medium' : 'adi-badge-low';

            container.innerHTML = `
              <div class="adi-result-card">
                <div class="adi-result-title">✅ Estimated Repair Cost: $${est.totalLow} – $${est.totalHigh}</div>
                <p style="margin-bottom:1.5rem; color:#475569;">Based on your ${brand} ${appliance} • ${issue}</p>
                <table class="adi-cost-table">
                  <thead><tr><th>Breakdown</th><th>Range</th></tr></thead>
                  <tbody>
                    <tr><td>Parts <span class="adi-badge ${sevClass}">${severity.toUpperCase()}</span></td><td>$${est.partsLow} – $${est.partsHigh}</td></tr>
                    <tr><td>Labor & Service</td><td>$${est.laborLow} – $${est.laborHigh}</td></tr>
                    <tr><td><strong>Total Estimated Cost</strong></td><td><strong>$${est.totalLow} – $${est.totalHigh}</strong></td></tr>
                  </tbody>
                </table>
                <p><strong>Factors considered:</strong></p>
                <ul style="padding-left:18px; line-height:1.7; color:#444;">
                  <li>${appliance} + ${issue} (${severity} severity)</li>
                  <li>${brand} parts & labor</li>
                  <li>Appliance age: ${ageDisplay[age]}</li>
                  ${zip.startsWith('334') ? '<li>Local Jupiter service discount applied ✓</li>' : ''}
                </ul>
                <div class="adi-action-row">
                  <a href="tel:+1${BUSINESS_PHONE}" style="text-decoration:none;">
                    <button class="adi-schedule-btn">📞 Get Free Quote from ${BUSINESS_NAME}</button>
                  </a>
                </div>
                <div class="adi-disclaimer">⚠️ Estimates are approximate. Actual cost confirmed after on-site diagnosis.<br><strong>Free quotes • Same-day service in Jupiter, FL</strong></div>
                <button class="adi-restart-btn" id="adiRestartBtn">↻ Start New Estimate</button>
              </div>
            `;

            document.getElementById('adiRestartBtn').addEventListener('click', () => {
              selections = { appliance: null, brand: null, issue: null, severity: null, age: null, zip: null };
              currentStep = 1;
              render();
            });
          }, 2200 + Math.random() * 1800);
        }

        // ==================== START ====================
        render();

      } catch (e) {
        console.error('Widget error:', e);
        container.innerHTML = '<p style="color:red;text-align:center;padding:3rem;">Error loading estimator. Please refresh.</p>';
      }
    })();
  </script>
</div>
